[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { workspace = true }
common = { path = "../common" }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }
tower-http = { version = "0.7", features = ["cors"] }
