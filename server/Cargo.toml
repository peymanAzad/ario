[package]
name = "server"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = { workspace = true }
axum = "0.8"
base64 = "0.23.0"
chrono = { workspace = true }
common = { path = "../common" }
directories = "6.0.0"
rand = "0.10"
reqwest = { workspace = true }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = {
  version = "1",
  features = ["macros", "net", "process", "rt", "signal", "sync", "time"]
}
toml = "1.1.4"
tower-http = { version = "0.7", features = ["cors"] }
