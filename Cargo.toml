[package]
name = "ario"
version = "0.1.2"
edition = "2024"
rust-version = "1.95"
description = "A batteries-included terminal download manager powered by aria2"
documentation = "https://github.com/peymanAzad/ario#readme"
readme = "README.md"
homepage = "https://github.com/peymanAzad/ario"
repository = "https://github.com/peymanAzad/ario"
license = "MIT"
keywords = ["aria2", "bittorrent", "download", "terminal", "tui"]
categories = ["command-line-utilities"]
# Publish only crate metadata, Rust sources (including tests), and the SQL schema.
# Leave demo media, development docs, CI, and runtime files out of the archive.
include = [
  "/Cargo.lock",
  "/Cargo.toml",
  "/LICENSE",
  "/README.md",
  "/common/src/**/*.rs",
  "/server/schema.sql",
  "/server/src/**/*.rs",
  "/tui/src/**/*.rs",
]
default-run = "ario"
autobins = false
resolver = "3"

# Shared types used by both binaries; included in this package.
[lib]
doc = false
name = "common"
path = "common/src/lib.rs"

[[bin]]
name = "ario"
path = "tui/src/main.rs"

[[bin]]
name = "ario_daemon"
path = "server/src/main.rs"

[dependencies]
anyhow = "1"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
axum = { version = "0.8", features = ["multipart"] }
base64 = "0.23.0"
catppuccin = "2"
chrono = { version = "0.4", features = ["serde"] }
crossterm = "0.29"
directories = "6.0"
rand = "0.10"
ratatui = "0.30"
regex = "1.13.1"
reqwest = { version = "0.13", features = ["blocking", "json", "multipart", "query"] }
rusqlite = { version = "0.40", features = ["bundled", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "process", "rt", "signal", "sync", "time"] }
toml = "1.1"
tower-http = { version = "0.7", features = ["cors"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.dist]
inherits = "release"
lto = "thin"
